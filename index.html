<style>
:root{--g:#2e9e4f;--gd:#1f7a3a;--bg:#f2f5f3;--c:#fff;--t:#1d2a22;--m:#6b7a71;--b:#dde5e0;--r:#d64545;--o:#e08a1e;--bl:#2b6cb0}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.9}
nav{display:flex;gap:6px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--b);overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--m);white-space:nowrap}
nav button.on{background:var(--g);color:#fff}
main{width:100%;max-width:1800px;margin:0 auto;padding:16px 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--c);border-radius:12px;padding:14px;border:1px solid var(--b)}
.card b{font-size:28px;display:block}.card span{color:var(--m);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font:inherit;background:#fff}
.bar input{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.btn{background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.btn{white-space:nowrap}.btn.s{padding:6px 10px;font-size:13px}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--r)}.btn.y{background:var(--o)}.btn:disabled{opacity:.5}
.tw{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--m);background:#f8faf9;position:sticky;top:0}
.bd{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.disponivel{background:var(--g)}.em_uso{background:var(--o)}.baixa{background:#888}
.retirada{background:var(--o)}.entrega{background:var(--bl)}
.ph{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--b)}
.mask{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.err{color:var(--r);font-size:13px;margin-top:8px}.m{color:var(--m);font-size:13px}
.login{max-width:360px;margin:12vh auto;background:#fff;padding:26px;border-radius:14px;border:1px solid var(--b)}
.login h2{margin-top:0;color:var(--gd)}.acts{display:flex;gap:6px;flex-wrap:wrap}

  <div><span class="pill" style="background:${c};color:#fff">${esc(FN(p.funcao_id)?.nome||'Sem função')}</span> ${p.ativo?'':'<span class="pill">Inativo</span> '}${p.logistica?`<span class="pill">🚚 Logística ${p.logistica==='fixo'?'(fixo)':'(eventual)'}</span> `:''}${n?`<button class="pill u" style="border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700" title="Ver quais ferramentas estão com esta pessoa e onde" onclick="verPessoaF('${p.id}')">🧰 ${n} com ele(a) ▸</button>`:''}</div>
  <div class="acts"><button class="btn s o" onclick="act(editP,'${p.id}',D.p)">✏️ Editar</button></div></div>`}).join('')||'<p class="m">Nenhuma pessoa encontrada.</p>'}</div>`}
function funcoes(){return`<div class="bar"><div class="m" style="flex:1;align-self:center">Funções disponíveis para as pessoas cadastradas.</div><button class="btn" onclick="novaFn()">+ Nova função</button></div>
 <div class="lg">${D.fn.map((x,i)=>{const c=fcor(x.id),n=D.p.filter(p=>p.funcao_id===x.id).length;return`<div class="tile" style="--c:${c};animation-delay:${i*30}ms"><b>🏷️ ${esc(x.nome)}</b><div><span class="pill">${n} ${n===1?'pessoa':'pessoas'}</span></div>
  <div class="acts"><button class="btn s o" onclick="act(editFn,'${x.id}',D.fn)">✏️ Editar</button></div></div>`}).join('')}</div>`}
function edic(){return`<div class="tw"><table><tr><th>Quando</th><th>Quem editou</th><th>Onde</th><th>Campo</th><th>De → Para</th><th>Validação</th></tr>
 ${D.e.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.usuario_nome)}</td><td>${esc(x.tabela)}: ${esc(x.registro)}</td><td>${esc(x.campo)}</td><td>${esc(x.valor_antigo||'∅')} → <b>${esc(x.valor_novo||'∅')}</b></td><td class="m">${esc(x.nota)}</td></tr>`).join('')||'<tr><td colspan=6 class="m">Nenhuma edição registrada.</td></tr>'}</table></div>`}
async function confirmView(tk){let recX='',recBind=()=>{};const box=h=>{$('#app').innerHTML=`<div class="login" style="max-width:460px;margin:6vh auto"><h2>🛠️ CIMI · Confirmação de recebimento</h2>${h}${recX}</div>`;recBind()};
 box('<p class="m">Carregando…</p>');
 const {data:i,error}=await sb.rpc('entrega_info',{p_token:tk});
 if(error||!i)return box('<p class="err">Link inválido ou expirado. Peça um novo link à Logística ou ao CIMI.</p>');
 const det=`<div class="card" style="margin:10px 0"><div><b>🧰 ${esc(i.ferramenta)}</b> <span class="m">${esc(i.patrimonio||'')}</span></div><div>📍 ${esc(i.local||'')}</div><div>🚚 Entregue por: <b>${esc(i.logistica||'Logística')}</b></div><div class="m">${fmt(i.quando)} · destinatário: ${esc(i.pessoa)}</div></div>`;
 recX=i.recolh==='pendente'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--o)">🚚 <strong>Recolhimento solicitado.</strong> A Logística foi avisada e virá buscar a ferramenta no local.</div>`
  :i.recolh==='recolhido'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--bl)">🚚 <strong>Ferramenta recolhida</strong> pela Logística${i.recolh_em?' em '+fmt(i.recolh_em):''}. Ela está a caminho do CIMI.</div>`
  :i.recolh==='concluido'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--g)">✔ <strong>Recolhimento concluído.</strong> A ferramenta foi recebida no CIMI${i.recebido_em?' em '+fmt(i.recebido_em):''}.</div>`
  :i.pode_recolher?`<button class="btn o" style="width:100%;margin-top:14px;padding:12px" id="crec">📦 Recolher material</button><div id="crecf"></div>`:'';
 recBind=()=>{const b=$('#crec');if(!b)return;b.onclick=()=>{b.style.display='none';
  $('#crecf').innerHTML=`<div class="card" style="margin-top:12px"><div class="m">Avise a Logística para recolher esta ferramenta e levá-la de volta ao CIMI.</div><label>Seu nome completo</label><input id="rn" value="${esc(i.pessoa||'')}"><label>Observação (opcional)</label><textarea id="ro" rows="2" placeholder="Ex.: serviço concluído, está na sala do encarregado"></textarea><label>📷 Foto de onde está a ferramenta e do que deve ser recolhido (opcional, ajuda a Logística)</label><input type="file" id="rfp" accept="image/*"><div id="rpp" style="margin:8px 0"></div><p class="err" id="rerr"></p><button class="btn" style="width:100%" id="rok">Enviar pedido de recolhimento</button></div>`;
  $('#rfp').onchange=()=>{const f=$('#rfp').files[0];$('#rpp').innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:10px">`:''};
  $('#rok').onclick=async()=>{const nm=$('#rn').value.trim(),ob=$('#ro').value.trim();if(nm.length<3)return $('#rerr').textContent='Informe seu nome completo.';
   $('#rok').disabled=true;let fu=null;const rf=$('#rfp').files[0];
   if(rf){try{$('#rerr').textContent='Enviando foto…';const bl=await shrink(rf),pa=`confirmacoes/${tk}/pedido-${Date.now()}.jpg`;const {error:ue}=await sb.storage.from('fotos').upload(pa,bl,{contentType:'image/jpeg'});if(ue)throw ue;fu=sb.storage.from('fotos').getPublicUrl(pa).data.publicUrl;$('#rerr').textContent=''}
    catch(e){$('#rok').disabled=false;return $('#rerr').textContent='Não foi possível enviar a foto: '+(e.message||e)}}
   const {data,error}=await sb.rpc('recolhimento_solicitar',{p_token:tk,p_nome:nm,p_obs:ob,p_foto:fu});
   if(error){$('#rok').disabled=false;return $('#rerr').textContent='Erro: '+error.message}
   if(data==='ok'||data==='ja_solicitado')return confirmView(tk);
   $('#rok').disabled=false;$('#rerr').textContent=data==='nao_aplicavel'?'Esta ferramenta já não está mais neste local.':'Não foi possível enviar o pedido.'}}};
 if(i.status!=='pendente')return box(det+`<p><span class="bd ${i.status==='confirmada'?'disponivel':'baixa'}">${i.status==='confirmada'?'✔ Recebimento confirmado':'⚠ Divergência informada'}</span></p><p class="m">${esc(i.conf_nome||'')} · ${i.conf_em?fmt(i.conf_em):''}</p>`+(i.conf_foto?`<p><img src="${esc(i.conf_foto)}" style="max-width:100%;border-radius:10px"></p>`:''));
 box(det+`<label>Seu nome completo</label><input id="cn" value="${esc(i.pessoa)}"><label>Observação (obrigatória se não recebeu)</label><textarea id="co" rows="2"></textarea><label>📷 Foto do recebimento (a ferramenta recebida no local)</label><input type="file" id="cf" accept="image/*" capture="environment"><div id="cp" style="margin:8px 0"></div><p class="err" id="ce"></p>
 <button class="btn" style="width:100%" id="cok">✔ Confirmo que recebi esta ferramenta</button><button class="btn o" style="width:100%;margin-top:8px" id="cno">⚠ Não recebi / tem divergência</button>`);
 const env=async ac=>{const nm=$('#cn').value.trim(),ob=$('#co').value.trim();if(nm.length<3)return $('#ce').textContent='Informe seu nome completo.';if(ac==='contestar'&&!ob)return $('#ce').textContent='Explique o que houve na observação.';
  const fl=$('#cf').files[0];if(ac==='confirmar'&&FOTO_OBRIGATORIA&&!fl)return $('#ce').textContent='Tire a foto da ferramenta recebida para confirmar.';
  $('#cok').disabled=$('#cno').disabled=true;$('#ce').textContent='';let fu=null;
  if(fl){try{$('#ce').textContent='Enviando foto…';const bl=await shrink(fl),pa=`confirmacoes/${tk}/${Date.now()}.jpg`;
   const {error:ue}=await sb.storage.from('fotos').upload(pa,bl,{contentType:'image/jpeg'});if(ue)throw ue;fu=sb.storage.from('fotos').getPublicUrl(pa).data.publicUrl;$('#ce').textContent=''}
   catch(e){$('#cok').disabled=$('#cno').disabled=false;return $('#ce').textContent='Não foi possível enviar a foto: '+(e.message||e)}}
  const {data,error}=await sb.rpc('entrega_confirmar',{p_token:tk,p_acao:ac,p_nome:nm,p_obs:ob,p_foto:fu});
  if(error){$('#cok').disabled=$('#cno').disabled=false;return $('#ce').textContent='Erro: '+error.message}
  box(det+(data==='ok'?`<p><span class="bd ${ac==='confirmar'?'disponivel':'baixa'}">${ac==='confirmar'?'✔ Recebimento confirmado, obrigado!':'⚠ Divergência registrada'}</span></p>`:'<p class="m">Esta entrega já havia sido respondida.</p>'))};
 $('#cf').onchange=()=>{const f=$('#cf').files[0];$('#cp').innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:10px">`:''};
 $('#cok').onclick=()=>env('confirmar');$('#cno').onclick=()=>env('contestar')}
const TK=new URLSearchParams(location.search).get('c');TK?confirmView(TK):start();
</script></body></html>
