<style>
:root{--g:#2e9e4f;--gd:#1f7a3a;--bg:#f2f5f3;--c:#fff;--t:#1d2a22;--m:#6b7a71;--b:#dde5e0;--r:#d64545;--o:#e08a1e;--bl:#2b6cb0}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.9}
nav{display:flex;gap:6px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--b);overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--m);white-space:nowrap}
nav button.on{background:var(--g);color:#fff}
main{width:100%;max-width:1800px;margin:0 auto;padding:16px 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--c);border-radius:12px;padding:14px;border:1px solid var(--b)}
.card b{font-size:28px;display:block}.card span{color:var(--m);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font:inherit;background:#fff}
.bar input{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.btn{background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.btn{white-space:nowrap}.btn.s{padding:6px 10px;font-size:13px}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--r)}.btn.y{background:var(--o)}.btn:disabled{opacity:.5}
.tw{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--m);background:#f8faf9;position:sticky;top:0}
.bd{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.disponivel{background:var(--g)}.em_uso{background:var(--o)}.baixa{background:#888}
.retirada{background:var(--o)}.entrega{background:var(--bl)}
.ph{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--b)}
.mask{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.err{color:var(--r);font-size:13px;margin-top:8px}.m{color:var(--m);font-size:13px}
.login{max-width:360px;margin:12vh auto;background:#fff;padding:26px;border-radius:14px;border:1px solid var(--b)}
.login h2{margin-top:0;color:var(--gd)}.acts{display:flex;gap:6px;flex-wrap:wrap}

 catch(e){throw new Error('sem conexão com a função "executores" do Supabase (ela precisa estar publicada com esse nome exato e com a verificação de JWT desligada)')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error||j.message||j.msg||'Falha ao criar os usuários')+' [código '+r.status+']');return j}
function credModal(res){const c=res.criados||[],e=res.erros||[],m=document.createElement('div');m.className='mask';
 const txt=c.map(x=>`${x.pessoa} — login: ${x.login.replace('@redemobconsorcio.com.br','')} — senha inicial: ${x.senha}`).join('\n');
 m.innerHTML=`<div class="modal"><h3>👤 Usuários dos executores</h3>
 ${c.length?`<p class="m">${c.length} usuário(s) criado(s). Na primeira entrada o sistema pede que a pessoa troque a senha.</p><div class="tw"><table><tr><th>Pessoa</th><th>Login</th><th>Senha inicial</th></tr>${c.map(x=>`<tr><td>${esc(x.pessoa)}</td><td><b>${esc(x.login.replace('@redemobconsorcio.com.br',''))}</b></td><td>${esc(x.senha)}</td></tr>`).join('')}</table></div>`:''}
 ${e.length?`<p class="err" style="margin-top:10px"><b>Não foi possível criar para ${e.length} pessoa(s):</b></p>${e.map(x=>`<div class="err">• ${esc(x.pessoa)}: ${esc(x.erro)}</div>`).join('')}`:''}
 <div class="acts" style="margin-top:14px">${c.length?'<button class="btn o" id="ccp">📋 Copiar lista</button>':''}<button class="btn" onclick="this.closest(\'.mask\').remove()">Fechar</button></div></div>`;
 document.body.appendChild(m);const b=m.querySelector('#ccp');if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Lista copiada ✔')}catch(x){toast('Não foi possível copiar')}}}
async function criaUsuariosExec(ids,todos){try{const res=await apiExec(todos?{todos:true}:{pessoa_ids:ids});await load();render();
 if((res.criados||[]).length||(res.erros||[]).length)credModal(res);else toast('Nenhum usuário novo para criar.')}
 catch(e){toast('Não foi possível criar o usuário: '+(e.message||e))}}
function criarExecs(){const n=D.p.filter(p=>p.ativo&&!p.usuario_id&&ehFuncExec(p.funcao_id)).length;
 if(!n)return toast('Todos os manutencionistas, jardineiros e pintores ativos já têm usuário.');
 if(!confirm(`Criar ${n} usuário(s)?\nLogin: nome.sobrenome · senha inicial: 123456 (a troca é obrigatória no 1º acesso).`))return;criaUsuariosExec(null,true)}

let EX=null,EXerr='',EXtab='min',EXbusy=false;
async function carregaEX(){if(EXbusy)return;EXbusy=true;
 try{const {data,error}=await sb.rpc('exec_minhas');if(error)throw error;EX=data||{pessoa:null,itens:[],pedidos:[]};EXerr='';try{const {data:k,error:ke}=await sb.rpc('meu_kit');EX.kit=ke?[]:(k||[])}catch(_){EX.kit=[]}}
 catch(e){EX=EX||{pessoa:null,itens:[],pedidos:[]};EXerr=e.message||String(e)}
 EXbusy=false;exView()}
let EXH=null,EXHerr='';
async function carregaEXH(){try{const {data,error}=await sb.rpc('exec_historico');if(error)throw error;EXH=data||[];EXHerr=''}catch(e){EXH=EXH||[];EXHerr=e.message||String(e)}exView()}

 if(EXHerr)return`<div class="card" style="border-left:4px solid var(--r)"><b>Não foi possível carregar o histórico.</b><div class="m">${esc(EXHerr)}</div><button class="btn o" style="margin-top:8px" onclick="carregaEXH()">↻ Tentar de novo</button></div>`;
 return EXH.map((h,hi)=>{const ret=h.tipo==='retirada';return`<div class="card" style="margin-bottom:12px;border-left:6px solid ${ret?'var(--o)':'var(--g)'}"><div style="font-size:12px;font-weight:700">${ret?(h.via_logistica?'🚚 RECEBIDA PELA LOGÍSTICA':'📤 RETIRADA'):'📥 DEVOLVIDA AO CIMI'}</div>
  <div style="font-size:18px;font-weight:800;margin:4px 0">${esc(h.ferramenta||'—')} <span class="m">${esc(h.patrimonio||'')}</span></div>
  <div class="m">${fmt(h.quando)}${h.local?(ret?' · 📍 levada para '+esc(h.local):' · 📍 devolvida de '+esc(h.local)):''}</div>
  ${h.via_logistica&&h.conf_status?`<div class="m">${h.conf_status==='confirmada'?'✔ Recebimento confirmado':h.conf_status==='contestada'?'⚠ Divergência informada':'⏳ Aguardando sua confirmação'}</div>`:''}
  ${h.registrado_por?`<div class="m">Registrado por ${esc(h.registrado_por)}</div>`:''}${h.obs?`<div style="margin-top:6px">💬 ${esc(h.obs)}</div>`:''}
  ${h.foto?`<img class="ph" src="${esc(h.foto)}" onclick="foto('${esc(h.foto)}')" style="margin-top:6px">`:''}
  <div class="acts" style="margin-top:8px"><button class="btn s" onclick="exHistDet(${hi})">🔎 Detalhes</button></div></div>`}).join('')||'<p class="m">Nenhuma movimentação registrada para você.</p>'};
function exHistDet(i){const h=(EXH||[])[i];if(!h)return;const ret=h.tipo==='retirada';
 const row=(l,v)=>v?`<div style="margin:4px 0"><span class="m">${l}</span><br><b>${v}</b></div>`:'';
 const conf=h.conf_status==='confirmada'?'✔ Recebimento confirmado':h.conf_status==='contestada'?'⚠ Divergência informada':h.conf_status==='pendente'?'⏳ Aguardando confirmação do recebimento':'';
 const tipo=ret?(h.via_logistica?'🚚 Recebida pela Logística (entrega no local)':'📤 Retirada'):'📥 Devolvida ao CIMI';
 const fotos=[[h.foto,ret?(h.via_logistica?'Foto da entrega':'Foto da retirada'):'Foto da devolução'],[h.conf_foto||h.conf_foto_url,'Foto do recebimento']].filter(f=>f[0]);
 const m=document.createElement('div');m.className='mask';m.addEventListener('click',e=>{if(e.target===m)m.remove()});
 m.innerHTML=`<div class="modal" style="max-width:520px"><h3>🔎 Detalhes da movimentação</h3>
  <div style="font-size:18px;font-weight:800;margin-bottom:6px">${esc(h.ferramenta||'—')} <span class="m">${esc(h.patrimonio||'')}</span></div>
  ${row('Tipo',tipo)}${row('Data e hora',h.quando?esc(fmt(h.quando)):'')}${row(ret?'Levada para':'Devolvida de',esc(h.local||''))}
  ${row('Pessoa',esc(h.pessoa||''))}${row('Levada por (Logística)',esc(h.logistica_nome||''))}${row('Registrado por',esc(h.registrado_por||''))}
  ${row('Situação do recebimento',conf)}${row('Confirmado por',esc(h.conf_nome||''))}${row('Confirmado em',h.conf_em?esc(fmt(h.conf_em)):'')}
  ${h.obs?`<div style="margin:4px 0"><span class="m">Observação</span><br>💬 ${esc(h.obs)}</div>`:''}${h.conf_obs?`<div style="margin:4px 0"><span class="m">Observação do recebimento</span><br>💬 ${esc(h.conf_obs)}</div>`:''}
  ${fotos.length?`<div class="acts" style="margin-top:8px">${fotos.map(f=>`<div style="text-align:center"><img class="ph" style="width:110px;height:110px" src="${esc(f[0])}" onclick="foto('${esc(f[0])}')"><div class="m">${f[1]}</div></div>`).join('')}</div>`:''}
  <div class="acts" style="margin-top:14px"><button class="btn o" onclick="this.closest('.mask').remove()">Fechar</button></div></div>`;document.body.appendChild(m)}
const exAtr=r=>r.status==='pendente'&&(Date.now()-new Date(r.quando))>864e5;
const exPend=()=>(EX?.itens||[]).filter(x=>x.via_logistica&&x.conf_status==='pendente');
const exSt=s=>s==='pendente'?'🔔 Retirada solicitada — aguardando a Logística':s==='recolhido'?'🚚 Retirada pela Logística — a caminho (CIMI ou destino autorizado)':s==='concluido'?'✔ Concluída — recebida no CIMI ou entregue no destino autorizado':s==='cancelado'?'Cancelada':(s||'—');

 ${conf?'<div style="font-size:12px;font-weight:700;color:var(--o)">📦 ENTREGA AGUARDANDO O SEU RECEBIMENTO</div>':''}

 <div class="m">${x.via_logistica&&x.logistica?`🚚 Entregue por ${esc(x.logistica)} · `:''}desde ${fmt(x.desde)}</div>

 ${x.foto?`<div style="margin-top:8px"><img src="${esc(x.foto)}" style="max-width:160px;max-height:160px;border-radius:8px;cursor:pointer;border:1px solid var(--b)" onclick="foto('${esc(x.foto)}')"></div>`:''}
 ${conf?`<div class="acts" style="margin-top:10px"><button class="btn" style="flex:1;padding:12px" onclick="exConfirmar('${x.mov_id}','confirmar')">✔ Confirmo que recebi</button><button class="btn o" onclick="exConfirmar('${x.mov_id}','contestar')">⚠ Não recebi</button></div>`
 :x.recolh?`<div style="margin-top:8px"><span class="bd em_uso" style="white-space:normal;display:inline-block">${esc(exSt(x.recolh))}</span></div>`
 :`<button class="btn y" style="width:100%;margin-top:10px;padding:12px" onclick="exSolicitar('${x.ferramenta_id}')">📦 Solicitar retirada</button>`}</div>`}
function exHtml(){if(EX===null){carregaEX();return'<p class="m">Carregando…</p>'}
 if(EXerr)return`<div class="card" style="border-left:4px solid var(--r)"><b>Não foi possível carregar.</b><div class="m">${esc(EXerr)}</div><button class="btn o" style="margin-top:8px" onclick="carregaEX()">↻ Tentar de novo</button></div>`;
 if(!EX.pessoa)return'<div class="card"><b>Seu usuário ainda não está ligado a uma pessoa cadastrada.</b><div class="m">Avise o CIMI para conferir o seu cadastro em Pessoas.</div></div>';
 const pen=exPend(),its=EX.itens||[],kit=EX.kit||[],resto=its.filter(x=>!(x.via_logistica&&x.conf_status==='pendente')),ped=EX.pedidos||[];
 return`<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;border-left:6px solid ${pen.length?'var(--o)':'var(--g)'}">
  <strong style="font-size:18px;flex:1">${pen.length?`🔔 ${pen.length} entrega(s) para confirmar`:'✔ Nada aguardando você'}<div class="m" style="font-weight:400">${esc(EX.pessoa.nome)}${EX.pessoa.funcao?' · '+esc(EX.pessoa.funcao):''}</div></strong><button class="btn o" onclick="carregaEX()">↻ Atualizar</button></div>
 <button class="btn y" style="width:100%;padding:14px;margin-bottom:6px;font-size:16px" onclick="exMaterial()">📸 Pedir retirada de material em outro local</button>
 <div class="m" style="margin-bottom:12px">Use quando houver material em algum local que não está no seu nome: tire a foto, escolha o local e a Logística recolhe e leva ao CIMI.</div>
 <div class="acts" style="margin-bottom:12px"><button class="btn ${EXtab==='min'?'':'o'}" style="flex:1;padding:12px" onclick="EXtab='min';exView()">🧰 Minhas ferramentas (${its.length+kit.length})</button><button class="btn ${EXtab==='ped'?'':'o'}" style="flex:1;padding:12px" onclick="EXtab='ped';exView()">📦 Meus pedidos (${ped.length})${ped.filter(exAtr).length?` <span class="pill" style="background:#b42318;color:#fff">🚨 ${ped.filter(exAtr).length} em atraso</span>`:''}</button><button class="btn ${EXtab==='hist'?'':'o'}" style="flex:1;padding:12px" onclick="EXtab='hist';EXH=null;exView()">🕘 Histórico</button></div>
 ${EXtab==='hist'?exHistHtml():EXtab==='min'?`${pen.length?`<h3 style="margin:4px 0 8px">Aguardando seu recebimento</h3>${pen.map(x=>exCard(x,true)).join('')}`:''}${resto.length?`<h3 style="margin:${pen.length?18:4}px 0 8px">Sob minha guarda</h3>${resto.map(x=>exCard(x,false)).join('')}`:''}${kit.length?`<h3 style="margin:${pen.length||resto.length?18:4}px 0 8px">🎒 Sob minha responsabilidade (kit pessoal) · 💰 ${kBRL(kTot(kit))}</h3><div class="card" style="border-left:6px solid var(--bl)">${kit.map(k=>`<div class="tl" style="border-left-color:var(--bl)"><strong>${esc(k.quantidade)}× ${esc(k.descricao)}</strong>${k.tipo?` <span class="pill">${esc(k.tipo)}</span>`:''}${k.patrimonio?` <span class="m">${esc(k.patrimonio)}</span>`:''}${kVal(k)!=null?` <span class="pill" style="background:#e8f6ec;color:#1e7a3c">${kBRL(kVal(k))}</span>`:''}<div class="m">Desde ${new Date(k.entregue_em).toLocaleDateString('pt-BR')}${k.entregue_por?' · entregue por '+esc(k.entregue_por):''}</div>${k.obs?`<div class="m">${esc(k.obs)}</div>`:''}</div>`).join('')}<div class="m" style="margin-top:6px">Se algum item não estiver com você, avise o CIMI.</div></div>`:''}${its.length||kit.length?'':'<p class="m">Você não tem nenhuma ferramenta sob sua guarda no momento.</p>'}`
 :ped.map(r=>{const atr=exAtr(r);return`<div class="card" style="margin-bottom:12px;border-left:6px solid ${r.status==='concluido'?'var(--g)':r.status==='recolhido'?'var(--bl)':atr?'var(--r)':'var(--o)'}"><div style="font-size:12px;font-weight:700">${esc(exSt(r.status))}</div>
  <div style="font-size:18px;font-weight:800;margin:4px 0">${esc(r.ferramenta)} <span class="m">${esc(r.patrimonio||'')}</span></div>${r.avulso?`<div><span class="pill u">📦 Material avulso</span>${r.local?` <span class="m">📍 ${esc(r.local)}</span>`:''}</div>`:''}<div class="m">Pedido em ${fmt(r.quando)}</div>${r.status==='pendente'?(atr?`<div style="margin:6px 0;padding:8px 10px;border-radius:8px;background:#fdecea;color:#b42318;font-weight:800">🚨 EM ATRASO — a Logística ainda não retirou. Aguardando há ${haTempo(r.quando)} <span style="font-weight:600">(prazo de 24 h excedido)</span></div>`:`<div style="margin:6px 0;padding:6px 10px;border-radius:8px;background:#fff4e5;color:#9a5b00;font-weight:700">⏱ Aguardando a Logística há ${haTempo(r.quando)} <span style="font-weight:600">· prazo: 24 h</span></div>`):''}${r.obs?`<div style="margin-top:6px">💬 ${esc(r.obs)}</div>`:''}
  ${r.recolhido_por?`<div class="m" style="margin-top:6px">🚚 Recolhido por ${esc(r.recolhido_por)}${r.recolhido_em?' · '+fmt(r.recolhido_em):''}</div>`:''}${r.recebido_em?`<div class="m">📥 Recebido no CIMI · ${fmt(r.recebido_em)}</div>`:''}</div>`}).join('')||'<p class="m">Você ainda não fez nenhum pedido de retirada (nos últimos 30 dias).</p>'}`}
function exView(){if(me.dual&&DM==='log')return logView();const n=exPend().length;document.title=(n?`(${n}) `:'')+'CIMI · Minhas ferramentas';
 $('#app').innerHTML=`<header><h1>🛠️ CIMI · Minhas ferramentas</h1><small>${esc(me.nome)}</small><button class="btn o s" onclick="sair()">Sair</button></header>${dualBar('ex')}<main style="max-width:720px;padding:14px">${exHtml()}</main>`}

async function exUp(file){const bl=await shrink(file),pa=`executor/${me.id}/${Date.now()}.jpg`;
 const {error}=await sb.storage.from('fotos').upload(pa,bl,{contentType:'image/jpeg'});if(error)throw error;

function exModal(html,bind){const m=document.createElement('div');m.className='mask';m.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(m);
 const pv=(i,o)=>{const el=m.querySelector(i);el.onchange=()=>{const f=el.files[0];m.querySelector(o).innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:240px;border-radius:10px">`:''}};
 bind(m,()=>m.remove(),pv);return m}
function exConfirmar(movId,acao){const x=(EX?.itens||[]).find(i=>i.mov_id===movId);if(!x)return;const cf=acao==='confirmar';
 exModal(`<h3>${cf?'✔ Confirmar recebimento':'⚠ Não recebi / divergência'}</h3><div><strong>${esc(x.nome)}</strong> <span class="m">${esc(x.patrimonio||'')}</span><div class="m">${esc(x.local||'')}${x.logistica?' · entregue por '+esc(x.logistica):''}</div></div>
 <label>${cf?'Observação (opcional)':'Explique o que houve (obrigatório)'}</label><textarea id="xo" rows="2"></textarea>
 <label>📷 Foto da ferramenta recebida no local (opcional)</label><input type="file" id="xf" accept="image/*" capture="environment"><div id="xp" style="margin:8px 0"></div><div class="err" id="xe"></div>
 <div class="acts" style="margin-top:14px"><button class="btn ${cf?'':'r'}" id="xok" style="flex:1;padding:12px">${cf?'✔ Confirmo que recebi':'Enviar divergência'}</button><button class="btn o" id="xno">Cancelar</button></div>`,
 (m,c,pv)=>{pv('#xf','#xp');m.querySelector('#xno').onclick=c;
  m.querySelector('#xok').onclick=async e=>{const b=e.target,er=m.querySelector('#xe'),ob=m.querySelector('#xo').value.trim(),fl=m.querySelector('#xf').files[0];er.textContent='';
   if(!cf&&!ob)return er.textContent='Explique o que houve na observação.';b.disabled=true;er.textContent='Enviando…';
   try{const url=fl?await exUp(fl):null;const {data,error}=await sb.rpc('exec_confirmar',{p_mov:movId,p_acao:acao,p_obs:ob,p_foto:url});if(error)throw error;
    if(data==='ok'||data==='ja_respondida'){c();toast(data==='ok'?(cf?'Recebimento confirmado ✔':'Divergência registrada ✔'):'Esta entrega já havia sido respondida');await carregaEX()}
    else{b.disabled=false;er.textContent=data==='obs_obrigatoria'?'Explique o que houve na observação.':'Não foi possível registrar ('+data+').'}}
   catch(x2){b.disabled=false;er.textContent='Erro: '+(x2.message||x2)}}})}

 (m,c,pv)=>{pv('#t5','#t6');m.querySelector('#t9').onclick=c;
  m.querySelector('#t8').onclick=async e=>{const b=e.target,er=m.querySelector('#t7'),o=m.querySelector('#t1').value,d=m.querySelector('#t2').value,mt=m.querySelector('#t3').value.trim(),ob=m.querySelector('#t4').value.trim(),fl=m.querySelector('#t5').files[0];er.textContent='';
   if(!o)return er.textContent='Selecione o local de origem.';if(!d)return er.textContent='Selecione o local de destino.';if(o===d)return er.textContent='Origem e destino não podem ser o mesmo local.';

const FCOR=['#2b6cb0','#d6457a','#2e9e4f','#7b4fc4','#c2410c','#0f8f8f','#8a6d3b'];

let fSel='todas';
function verPessoaF(id){const p=D.p.find(x=>x.id===id);if(!p)return;
 const fs=D.f.filter(f=>f.status==='em_uso'&&f.responsavel_atual===p.nome);
 const mvDe=f=>{const ms=D.m.filter(y=>y.ferramenta_id===f.id&&y.tipo==='retirada').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return ms.find(y=>y.pessoa===p.nome)||ms[0]||null};
 const m=document.createElement('div');m.className='mask';m.addEventListener('click',e=>{if(e.target===m)m.remove()});
 m.innerHTML=`<div class="modal" style="max-width:560px"><h3>🧰 Ferramentas com ${esc(p.nome)}</h3><div class="m" style="margin-bottom:8px">${esc(FN(p.funcao_id)?.nome||'')} · ${fs.length} ferramenta${fs.length===1?'':'s'} agora</div>
 ${fs.map(f=>{const x=mvDe(f),loc=L(f.local_atual_id),rec=recAtiva(f.id);
  return`<div class="tl" style="border-left-color:var(--o)"><div><b>${esc(f.nome)}</b> <span class="m">${esc(f.patrimonio||'')}</span></div>
  <div>📍 <b>${esc(loc?.nome||'—')}</b>${loc?.grupo?` <span class="m">(${esc(loc.grupo)})</span>`:''}</div>
  ${x?`<div class="m">${x.via_logistica?`🚚 Entregue pela Logística (${esc(x.logistica_nome||'—')})`:'📤 Retirada direta'} · ${fmt(x.created_at)} · ${dias(x)}</div>
  ${x.via_logistica?`<div style="margin-top:4px">${x.conf_status==='confirmada'?'<span class="bd disponivel">✔ Recebimento confirmado</span>':x.conf_status==='contestada'?'<span class="bd baixa">⚠ Divergência</span>':'<span class="bd em_uso">⏳ Aguardando confirmação</span>'}</div>`:''}`:''}
  ${rec?`<div style="margin-top:4px"><span class="bd em_uso" style="white-space:normal;display:inline-block">${rec.status==='recolhido'?(altRec(rec.id)?'🚚 Retirado pela Logística — a caminho do destino':solRec(rec.id)?'⏳ Retirado — aguardando aprovação do destino':'🚚 Recolhido pela Logística — a caminho do CIMI'):(altRec(rec.id)?'🚚 Entrega autorizada — aguardando a Logística':solRec(rec.id)?'🔀 Destino aguardando aprovação':'🔔 Recolhimento solicitado')}</span></div>`:''}
  <div class="acts" style="margin-top:6px">${x?.foto_url?`<img class="ph" src="${esc(x.foto_url)}" onclick="foto('${esc(x.foto_url)}')">`:''}${x?`<button class="btn s o" onclick="this.closest('.mask').remove();movDet('${x.id}')">🔎 Ver percurso completo</button>`:''}</div></div>`}).join('')||'<p class="m">Nenhuma ferramenta com esta pessoa no momento.</p>'}
 <button class="btn o" style="margin-top:10px" onclick="this.closest('.mask').remove()">Fechar</button></div>`;document.body.appendChild(m)}
function pessoas(){const t=q.toLowerCase();if(fSel!=='todas'&&!FN(fSel))fSel='todas';
 const com=p=>D.f.filter(f=>f.status==='em_uso'&&f.responsavel_atual===p.nome).length;
 const r=D.p.filter(p=>(fSel==='todas'||p.funcao_id===fSel)&&`${p.nome} ${FN(p.funcao_id)?.nome}`.toLowerCase().includes(t));
 const fIc=n=>/jardin/i.test(n)?'🌿':/manuten/i.test(n)?'🔧':/pintor|pintura/i.test(n)?'🎨':/log[ií]stic/i.test(n)?'🚚':'🏷️';
 const chip=(id,n,c,ic)=>{const k=id==='todas'?D.p.length:D.p.filter(p=>p.funcao_id===id).length;return`<button class="gc ${fSel===id?'on':''}" style="--c:${c}" onclick="fSel='${id}';render()"><span class="ic">${ic}</span><b>${esc(n)}</b><span class="n">${k}</span> <span style="font-size:13px">${k===1?'pessoa':'pessoas'}</span><div class="bar2"><i style="width:${D.p.length?Math.round(k/D.p.length*100):0}%"></i></div></button>`};
 return`<div class="gg">${chip('todas','Todas as funções','#1d2a22','👷')}${D.fn.map(x=>chip(x.id,x.nome,fcor(x.id),fIc(x.nome))).join('')}</div>
 <div class="bar"><input id="q" name="busca_cimi" autocomplete="off" data-lpignore="true" placeholder="🔎 Buscar pessoa ou função..." value="${esc(q)}">${(()=>{const n=D.p.filter(p=>p.ativo&&!p.usuario_id&&ehFuncExec(p.funcao_id)).length;return n?`<button class="btn y" onclick="criarExecs()">👤 Criar usuários dos executores (${n})</button>`:''})()}<button class="btn" onclick="novaP()">+ Nova pessoa</button></div>
 <div class="lg">${r.map((p,i)=>{const c=fcor(p.funcao_id),n=com(p);return`<div class="tile" style="--c:${c};animation-delay:${Math.min(i,12)*30}ms;${p.ativo?'':'opacity:.55'}">
  <div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;border-radius:50%;background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">${esc(p.nome.trim()[0]||'?')}</div><b>${esc(p.nome)}</b></div>
  <div><span class="pill" style="background:${c};color:#fff">${esc(FN(p.funcao_id)?.nome||'Sem função')}</span> ${p.ativo?'':'<span class="pill">Inativo</span> '}${p.usuario_id?'<span class="pill z">👤 tem usuário</span> ':''}${p.logistica?`<span class="pill">🚚 Logística ${p.logistica==='fixo'?'(fixo)':'(eventual)'}</span> `:''}${n?`<button class="pill u" style="border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700" title="Ver quais ferramentas estão com esta pessoa e onde" onclick="verPessoaF('${p.id}')">🧰 ${n} com ele(a) ▸</button>`:''}${kIt(p.id).length?` <button class="pill" style="border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700;background:#e8f0fb;color:#2b6cb0" title="Ver o kit pessoal de ferramentas desta pessoa" onclick="kitVer('${p.id}')">🎒 ${kUn(kIt(p.id))} no kit ▸</button>`:''}</div>
  <div class="acts"><button class="btn s o" onclick="act(editP,'${p.id}',D.p)">✏️ Editar</button></div></div>`}).join('')||'<p class="m">Nenhuma pessoa encontrada.</p>'}</div>`}
function funcoes(){return`<div class="bar"><div class="m" style="flex:1;align-self:center">Funções disponíveis para as pessoas cadastradas.</div><button class="btn" onclick="novaFn()">+ Nova função</button></div>
 <div class="lg">${D.fn.map((x,i)=>{const c=fcor(x.id),n=D.p.filter(p=>p.funcao_id===x.id).length;return`<div class="tile" style="--c:${c};animation-delay:${i*30}ms"><b>🏷️ ${esc(x.nome)}</b><div><span class="pill">${n} ${n===1?'pessoa':'pessoas'}</span></div>
  <div class="acts"><button class="btn s o" onclick="act(editFn,'${x.id}',D.fn)">✏️ Editar</button></div></div>`}).join('')}</div>`}
function edic(){return`<div class="tw"><table><tr><th>Quando</th><th>Quem editou</th><th>Onde</th><th>Campo</th><th>De → Para</th><th>Validação</th></tr>
 ${D.e.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.usuario_nome)}</td><td>${esc(x.tabela)}: ${esc(x.registro)}</td><td>${esc(x.campo)}</td><td>${esc(x.valor_antigo||'∅')} → <b>${esc(x.valor_novo||'∅')}</b></td><td class="m">${esc(x.nota)}</td></tr>`).join('')||'<tr><td colspan=6 class="m">Nenhuma edição registrada.</td></tr>'}</table></div>`}
async function confirmView(tk){let recX='',recBind=()=>{};const box=h=>{$('#app').innerHTML=`<div class="login" style="max-width:460px;margin:6vh auto"><h2>🛠️ CIMI · Confirmação de recebimento</h2>${h}${recX}</div>`;recBind()};
 box('<p class="m">Carregando…</p>');
 const {data:i,error}=await sb.rpc('entrega_info',{p_token:tk});
 if(error||!i)return box('<p class="err">Link inválido ou expirado. Peça um novo link à Logística ou ao CIMI.</p>');
 const det=`<div class="card" style="margin:10px 0"><div><b>🧰 ${esc(i.ferramenta)}</b> <span class="m">${esc(i.patrimonio||'')}</span></div><div>📍 ${esc(i.local||'')}</div><div>🚚 Entregue por: <b>${esc(i.logistica||'Logística')}</b></div><div class="m">${fmt(i.quando)} · destinatário: ${esc(i.pessoa)}</div></div>`;
 recX=i.recolh==='pendente'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--o)">🚚 <strong>Recolhimento solicitado.</strong> A Logística foi avisada e virá buscar a ferramenta no local.</div>`
  :i.recolh==='recolhido'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--bl)">🚚 <strong>Ferramenta recolhida</strong> pela Logística${i.recolh_em?' em '+fmt(i.recolh_em):''}. Ela está a caminho do CIMI ou do destino autorizado.</div>`
  :i.recolh==='concluido'?`<div class="card" style="margin:14px 0 0;border-left:4px solid var(--g)">✔ <strong>Recolhimento concluído.</strong> ${i.recebido_em?'A ferramenta foi recebida no CIMI em '+fmt(i.recebido_em)+'.':'A ferramenta foi recebida (no CIMI ou no destino autorizado).'}</div>`
  :i.pode_recolher?`<button class="btn o" style="width:100%;margin-top:14px;padding:12px" id="crec">📦 Recolher material</button><div id="crecf"></div>`:'';
 recBind=()=>{const b=$('#crec');if(!b)return;b.onclick=()=>{b.style.display='none';
  $('#crecf').innerHTML=`<div class="card" style="margin-top:12px"><div class="m">Avise a Logística para recolher esta ferramenta e levá-la de volta ao CIMI.</div><label>Seu nome completo</label><input id="rn" value="${esc(i.pessoa||'')}"><label>Observação (opcional)</label><textarea id="ro" rows="2" placeholder="Ex.: serviço concluído, está na sala do encarregado"></textarea><label>📷 Foto de onde está a ferramenta e do que deve ser recolhido (opcional, ajuda a Logística)</label><input type="file" id="rfp" accept="image/*"><div id="rpp" style="margin:8px 0"></div><p class="err" id="rerr"></p><button class="btn" style="width:100%" id="rok">Enviar pedido de recolhimento</button></div>`;
  $('#rfp').onchange=()=>{const f=$('#rfp').files[0];$('#rpp').innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:10px">`:''};
  $('#rok').onclick=async()=>{const nm=$('#rn').value.trim(),ob=$('#ro').value.trim();if(nm.length<3)return $('#rerr').textContent='Informe seu nome completo.';
   $('#rok').disabled=true;let fu=null;const rf=$('#rfp').files[0];
   if(rf){try{$('#rerr').textContent='Enviando foto…';const bl=await shrink(rf),pa=`confirmacoes/${tk}/pedido-${Date.now()}.jpg`;const {error:ue}=await sb.storage.from('fotos').upload(pa,bl,{contentType:'image/jpeg'});if(ue)throw ue;fu=sb.storage.from('fotos').getPublicUrl(pa).data.publicUrl;$('#rerr').textContent=''}
    catch(e){$('#rok').disabled=false;return $('#rerr').textContent='Não foi possível enviar a foto: '+(e.message||e)}}
   const {data,error}=await sb.rpc('recolhimento_solicitar',{p_token:tk,p_nome:nm,p_obs:ob,p_foto:fu});
   if(error){$('#rok').disabled=false;return $('#rerr').textContent='Erro: '+error.message}
   if(data==='ok'||data==='ja_solicitado')return confirmView(tk);
   $('#rok').disabled=false;$('#rerr').textContent=data==='nao_aplicavel'?'Esta ferramenta já não está mais neste local.':'Não foi possível enviar o pedido.'}}};
 if(i.status!=='pendente')return box(det+`<p><span class="bd ${i.status==='confirmada'?'disponivel':'baixa'}">${i.status==='confirmada'?'✔ Recebimento confirmado':'⚠ Divergência informada'}</span></p><p class="m">${esc(i.conf_nome||'')} · ${i.conf_em?fmt(i.conf_em):''}</p>`+(i.conf_foto?`<p><img src="${esc(i.conf_foto)}" style="max-width:100%;border-radius:10px"></p>`:''));
 box(det+`<label>Seu nome completo</label><input id="cn" value="${esc(i.pessoa)}"><label>Observação (obrigatória se não recebeu)</label><textarea id="co" rows="2"></textarea><label>📷 Foto do recebimento (a ferramenta recebida no local)</label><input type="file" id="cf" accept="image/*" capture="environment"><div id="cp" style="margin:8px 0"></div><p class="err" id="ce"></p>
 <button class="btn" style="width:100%" id="cok">✔ Confirmo que recebi esta ferramenta</button><button class="btn o" style="width:100%;margin-top:8px" id="cno">⚠ Não recebi / tem divergência</button>`);
 const env=async ac=>{const nm=$('#cn').value.trim(),ob=$('#co').value.trim();if(nm.length<3)return $('#ce').textContent='Informe seu nome completo.';if(ac==='contestar'&&!ob)return $('#ce').textContent='Explique o que houve na observação.';
  const fl=$('#cf').files[0];if(ac==='confirmar'&&FOTO_OBRIGATORIA&&!fl)return $('#ce').textContent='Tire a foto da ferramenta recebida para confirmar.';
  $('#cok').disabled=$('#cno').disabled=true;$('#ce').textContent='';let fu=null;
  if(fl){try{$('#ce').textContent='Enviando foto…';const bl=await shrink(fl),pa=`confirmacoes/${tk}/${Date.now()}.jpg`;
   const {error:ue}=await sb.storage.from('fotos').upload(pa,bl,{contentType:'image/jpeg'});if(ue)throw ue;fu=sb.storage.from('fotos').getPublicUrl(pa).data.publicUrl;$('#ce').textContent=''}
   catch(e){$('#cok').disabled=$('#cno').disabled=false;return $('#ce').textContent='Não foi possível enviar a foto: '+(e.message||e)}}
  const {data,error}=await sb.rpc('entrega_confirmar',{p_token:tk,p_acao:ac,p_nome:nm,p_obs:ob,p_foto:fu});
  if(error){$('#cok').disabled=$('#cno').disabled=false;return $('#ce').textContent='Erro: '+error.message}
  box(det+(data==='ok'?`<p><span class="bd ${ac==='confirmar'?'disponivel':'baixa'}">${ac==='confirmar'?'✔ Recebimento confirmado, obrigado!':'⚠ Divergência registrada'}</span></p>`:'<p class="m">Esta entrega já havia sido respondida.</p>'))};
 $('#cf').onchange=()=>{const f=$('#cf').files[0];$('#cp').innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:10px">`:''};
 $('#cok').onclick=()=>env('confirmar');$('#cno').onclick=()=>env('contestar')}
(()=>{const dec=()=>document.querySelectorAll('input[type=password]:not([data-olho])').forEach(i=>{i.dataset.olho=1;if(i.id==='pw')return;
 const w=document.createElement('div');w.style.cssText='display:flex;gap:6px;align-items:stretch';i.parentNode.insertBefore(w,i);w.appendChild(i);i.style.flex='1';i.style.width='auto';i.style.minWidth='0';

 b.onclick=()=>{const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'🙈':'👁';i.removeAttribute('readonly');i.focus()};w.appendChild(b)});
 new MutationObserver(dec).observe(document.documentElement,{childList:true,subtree:true});dec()})();
